buildscript {
    ext.kotlin_version = '2.2.20'
    ext {
        compileSdkVersion   = 36
        targetSdkVersion    = 36
        minSdkVersion    = 26
        appCompatVersion    = "1.6.1"
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Override flutter_web_browser's SDK 31 after its build script configures Android
    if (project.name == 'flutter_web_browser') {
        project.pluginManager.withPlugin('com.android.library') {
            project.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
                androidDsl.compileSdk = rootProject.ext.compileSdkVersion
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
